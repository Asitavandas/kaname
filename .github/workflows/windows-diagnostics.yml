name: KANAME Windows diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-diagnostics.yml'
      - 'tools/windows_diagnose.py'
      - 'tools/windows_diagnose.ps1'
      - 'tools/windows_baseline.json'
permissions:
  contents: read
concurrency:
  group: kaname-windows-diagnostics
  cancel-in-progress: false
jobs:
  inspect-existing-installation:
    if: github.repository == 'Asitavandas/kaname' && github.event.repository.private == true
    runs-on: [self-hosted, Windows, X64, kaname-windows]
    timeout-minutes: 5
    env:
      KANAME_LOCAL_ROOT: 'C:\Users\Administrator\KANAME'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout reviewed diagnostic code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Inspect existing KANAME without exporting secrets
        run: '& .\tools\windows_diagnose.ps1 -Root $env:KANAME_LOCAL_ROOT'
