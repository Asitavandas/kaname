name: AuthWire isolated write preclaim checks
on:
  pull_request:
    paths:
      - 'windows/connector/StagingWritePreclaim.ps1'
      - 'windows/connector/Read-AuthWireStagingWritePreflight.ps1'
      - 'tools/staging_write_preclaim_windows_check.ps1'
      - 'tools/staging_write_preclaim_wire_check.py'
      - '.github/workflows/staging-write-preclaim.yml'
  push:
    branches: [main]
    paths:
      - 'windows/connector/StagingWritePreclaim.ps1'
      - 'windows/connector/Read-AuthWireStagingWritePreflight.ps1'
      - 'tools/staging_write_preclaim_windows_check.ps1'
      - 'tools/staging_write_preclaim_wire_check.py'
      - '.github/workflows/staging-write-preclaim.yml'
permissions:
  contents: read
jobs:
  native-preclaim:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - name: Native preclaim durability and Python RSA protocol interoperability
        shell: powershell
        run: |
          $env:AUTHWIRE_WRITE_WIRE_OUTPUT=Join-Path $env:RUNNER_TEMP write-preclaim-wire.json
          tools/staging_write_preclaim_windows_check.ps1
          if($LASTEXITCODE -ne 0){throw 'Native preclaim check failed'}
          python tools/staging_write_preclaim_wire_check.py $env:AUTHWIRE_WRITE_WIRE_OUTPUT
