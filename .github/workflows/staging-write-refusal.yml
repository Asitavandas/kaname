name: AuthWire preauthorization refusal reporting
on:
  pull_request:
    paths:
      - 'windows/connector/**'
      - 'kaname/staging_write_jobs.py'
      - 'tools/staging_write_*'
      - '.github/workflows/staging-write-refusal.yml'
  push:
    branches: [main]
    paths:
      - 'windows/connector/**'
      - 'kaname/staging_write_jobs.py'
      - 'tools/staging_write_*'
      - '.github/workflows/staging-write-refusal.yml'
permissions:
  contents: read
jobs:
  native-write-refusal:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Tested fixture TLS dependency
        run: python -m pip install cryptography==46.0.0
      - name: Refusal result with no CLAIM or filesystem effects
        shell: powershell
        run: |
          python tools/staging_write_refusal_windows_check.py
          if($LASTEXITCODE -ne 0){throw 'Native refusal fixture failed'}
