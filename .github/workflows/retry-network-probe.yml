name: AuthWire bounded retry network probe checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-kernel-timeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install namespace-only nft dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y nftables iproute2
      - name: Scope and input guards
        run: python3 -m unittest tests.test_retry_network_probe -v
      - name: Actual kernel expiry and unrelated traffic preservation in private network namespace
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 -m tools.retry_probe_native_check
