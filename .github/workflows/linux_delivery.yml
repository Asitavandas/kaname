name: AuthWire reproducible Linux delivery
on:
  pull_request:
    paths: ['kaname/**', 'tools/**', 'tests/**', 'pyproject.toml', '.github/workflows/linux_delivery.yml']
  push:
    branches: [main]
    paths: ['kaname/**', 'tools/**', 'tests/**', 'pyproject.toml', '.github/workflows/linux_delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - name: Git integrity, manifest and updater boundaries
        run: python -B -m unittest tests.test_linux_delivery tests.test_linux_update -v
      - name: Build two independent delivery candidates
        run: |
          python -B -m tools.package_linux_delivery --source . --expected-commit "$SOURCE_SHA" --destination "$RUNNER_TEMP/authwire-linux-delivery"
          python -B -m tools.package_linux_delivery --source . --expected-commit "$SOURCE_SHA" --destination "$RUNNER_TEMP/authwire-linux-delivery-repeat"
      - name: Verify reproducibility and publish safe checksum metadata
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          first = Path(os.environ['RUNNER_TEMP']) / 'authwire-linux-delivery'
          second = Path(os.environ['RUNNER_TEMP']) / 'authwire-linux-delivery-repeat'
          assert sorted(p.name for p in first.iterdir()) == sorted(p.name for p in second.iterdir())
          for path in first.iterdir():
              assert path.read_bytes() == (second / path.name).read_bytes(), path.name
          print((first / 'DELIVERY.json').read_text())
          print((first / 'SHA256SUMS').read_text())
          PY
      - name: Retain verified candidate bundles and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authwire-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/authwire-linux-delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
