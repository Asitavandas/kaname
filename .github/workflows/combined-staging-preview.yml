name: AuthWire combined staging preview checks
on:
  pull_request:
    paths:
      - 'windows/connector/CombinedStagingPreview.ps1'
      - 'windows/connector/SysvolInventory.ps1'
      - 'windows/connector/CombinedDeploymentScope.ps1'
      - 'windows/connector/Test-AuthWireDeploymentCandidate.ps1'
      - 'tools/combined_staging_preview_windows_check.ps1'
      - 'tools/staging_preview_wire_check.py'
      - 'kaname/staging_preview_jobs.py'
      - 'windows/connector/Read-AuthWireCombinedStagingPreview.ps1'
      - 'windows/connector/Invoke-AuthWireStagingPreviewJob.ps1'
      - '.github/workflows/combined-staging-preview.yml'
  push:
    branches: [main]
    paths:
      - 'windows/connector/CombinedStagingPreview.ps1'
      - 'windows/connector/SysvolInventory.ps1'
      - 'windows/connector/CombinedDeploymentScope.ps1'
      - 'windows/connector/Test-AuthWireDeploymentCandidate.ps1'
      - 'tools/combined_staging_preview_windows_check.ps1'
      - 'tools/staging_preview_wire_check.py'
      - 'kaname/staging_preview_jobs.py'
      - 'windows/connector/Read-AuthWireCombinedStagingPreview.ps1'
      - 'windows/connector/Invoke-AuthWireStagingPreviewJob.ps1'
      - '.github/workflows/combined-staging-preview.yml'
permissions:
  contents: read
jobs:
  native-staging-preview:
    runs-on: windows-2025
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - name: Fixed staging proposal, exact rollback boundary and real SMB reads
        shell: powershell
        run: |
          $env:AUTHWIRE_STAGING_WIRE_OUTPUT=Join-Path $env:RUNNER_TEMP staging-preview-wire.json
          tools/combined_staging_preview_windows_check.ps1
          python tools/staging_preview_wire_check.py $env:AUTHWIRE_STAGING_WIRE_OUTPUT
