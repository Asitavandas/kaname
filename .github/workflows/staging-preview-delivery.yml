name: AuthWire staging preview worker delivery checks
on:
  pull_request:
    paths:
      - 'docs/checkpoints/2026-10-28-dc01-staging-preview-worker-upgrade.ps1'
      - 'tools/staging_preview_delivery_windows_check.ps1'
      - 'tests/test_staging_preview_worker_delivery.py'
      - '.github/workflows/staging-preview-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'docs/checkpoints/2026-10-28-dc01-staging-preview-worker-upgrade.ps1'
      - 'tools/staging_preview_delivery_windows_check.ps1'
      - 'tests/test_staging_preview_worker_delivery.py'
      - '.github/workflows/staging-preview-delivery.yml'
permissions:
  contents: read
jobs:
  native-delivery:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exact signed delivery and previous full package compatibility
        shell: powershell
        run: tools/staging_preview_delivery_windows_check.ps1
