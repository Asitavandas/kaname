name: Root CRL operator and issuance boundaries
on:
  pull_request:
    paths:
      - 'kaname/root_crl.py'
      - 'kaname/pki.py'
      - 'kaname/device_enrollment.py'
      - 'tests/test_root_crl.py'
      - '.github/workflows/root-crl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-crl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - run: python -m unittest tests.test_root_crl tests.test_pki -v
      - if: runner.os == 'Linux'
        run: python -m unittest tests.test_device_enrollment tests.test_user_enrollment -v
      - run: python -m compileall -q kaname/root_crl.py
