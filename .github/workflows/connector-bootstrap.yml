name: AuthWire Windows connector bootstrap checks
on:
  pull_request:
    paths: ['windows/connector/**', 'kaname/connector_channel.py', 'kaname/connector_registry.py', 'kaname/server.py', 'tools/connector_transport_windows_*', 'tests/test_connector_channel.py', 'tools/connector_channel_windows_*', 'tools/connector_bootstrap_windows_check.ps1', 'tools/connector_service_rights_windows_check.ps1', 'tools/connector_service_right_prepare_windows_check.ps1', 'tools/connector_service_logon_probe_windows_check.ps1', 'tools/connector_deployment_gpo_windows_check.ps1', 'tools/connector_gpo_write_probe_windows_check.ps1', 'tools/connector_signing_readiness_windows_check.ps1', 'tools/connector_signing_template_windows_check.ps1', 'tools/connector_signing_key_acl_windows_check.ps1', 'tools/connector_service_signing_probe_windows_check.ps1', 'tools/connector_service_authenticode_windows_check.ps1', '.github/workflows/connector-bootstrap.yml']
  push:
    branches: [main]
    paths: ['windows/connector/**', 'kaname/connector_channel.py', 'kaname/connector_registry.py', 'kaname/server.py', 'tools/connector_transport_windows_*', 'tests/test_connector_channel.py', 'tools/connector_channel_windows_*', 'tools/connector_bootstrap_windows_check.ps1', 'tools/connector_service_rights_windows_check.ps1', 'tools/connector_service_right_prepare_windows_check.ps1', 'tools/connector_service_logon_probe_windows_check.ps1', 'tools/connector_deployment_gpo_windows_check.ps1', 'tools/connector_gpo_write_probe_windows_check.ps1', 'tools/connector_signing_readiness_windows_check.ps1', 'tools/connector_signing_template_windows_check.ps1', 'tools/connector_signing_key_acl_windows_check.ps1', 'tools/connector_service_signing_probe_windows_check.ps1', 'tools/connector_service_authenticode_windows_check.ps1', '.github/workflows/connector-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Load genuine AD property collection types without an AD forest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable ActiveDirectory)) {
            $result = Install-WindowsFeature RSAT-AD-PowerShell
            if (-not $result.Success) { throw 'AD management tools installation failed.' }
          }
          Import-Module ActiveDirectory
          $collection = New-Object Microsoft.ActiveDirectory.Management.ADPropertyValueCollection
          $null = $collection.Add(515)
          if ($collection.Count -ne 1) { throw 'Native AD collection unavailable.' }
      - name: Native PowerShell 5.1 bootstrap boundaries without customer AD
        shell: powershell
        run: tools/connector_bootstrap_windows_check.ps1

      - name: Native local LSA read without policy writes or AD
        shell: powershell
        run: tools/connector_service_rights_windows_check.ps1
      - name: Native bounded service-right add on unused fixture SID with cleanup
        shell: powershell
        run: tools/connector_service_right_prepare_windows_check.ps1
      - name: Native SID resolution and bounded GPO preparation with directory calls simulated
        shell: powershell
        run: tools/connector_deployment_gpo_windows_check.ps1
      - name: Native signing provider metadata and readonly CA-template inspection with directory simulated
        shell: powershell
        run: tools/connector_signing_readiness_windows_check.ps1
      - name: Bounded unpublished machine signing template plan and LDAP requests with directory simulated
        shell: powershell
        run: tools/connector_signing_template_windows_check.ps1
  windows-scm-probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Native signed short-lived SCM service and runtime identity with cleanup
        shell: powershell
        run: tools/connector_service_logon_probe_windows_check.ps1

      - name: Native bounded GPO write engine and signed SCM helper with directory simulated
        shell: powershell
        run: tools/connector_gpo_write_probe_windows_check.ps1

      - name: Native exact key ACL comparison and NTFS auto-inherited metadata roundtrip
        shell: powershell
        run: tools/connector_signing_key_acl_windows_check.ps1

      - name: Actual low-privilege signed SCM worker and non-exportable machine key challenge signing
        shell: powershell
        run: tools/connector_service_signing_probe_windows_check.ps1

      - name: Actual non-executed Authenticode artifact signing under a low-privilege SCM service
        shell: powershell
        run: tools/connector_service_authenticode_windows_check.ps1

  windows-channel:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Tested channel cryptography dependency
        run: python -m pip install cryptography==46.0.0
      - name: Channel replay, expiry, revocation and scope boundaries
        run: python -m unittest tests.test_connector_channel -v
      - name: Real Windows PowerShell 5.1 non-exportable CNG key to Python proof verification
        run: python tools/connector_channel_windows_check.py

      - name: Dedicated machine key preparation and real verified pinned HTTPS health
        run: python tools/connector_transport_windows_check.py
