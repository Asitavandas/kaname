name: AuthWire Windows connector bootstrap checks
on:
  pull_request:
    paths: ['windows/connector/**', 'tools/connector_bootstrap_windows_check.ps1', '.github/workflows/connector-bootstrap.yml']
  push:
    branches: [main]
    paths: ['windows/connector/**', 'tools/connector_bootstrap_windows_check.ps1', '.github/workflows/connector-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Native PowerShell 5.1 bootstrap boundaries without customer AD
        shell: powershell
        run: tools/connector_bootstrap_windows_check.ps1
