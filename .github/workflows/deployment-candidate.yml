name: AuthWire signed deployment candidate checks
on:
  pull_request:
    paths: ['windows/connector/New-AuthWireDeploymentCandidate.ps1', 'windows/connector/Test-AuthWireDeploymentCandidate.ps1', 'windows/connector/Test-AuthWireCandidateService.ps1', 'tools/deployment_candidate_service_windows_*', 'tools/deployment_candidate_windows_*', 'docs/checkpoints/2026-10-26-dc01-deployment-candidate.ps1', 'kaname/deployment.py', '.github/workflows/deployment-candidate.yml']
  push:
    branches: [main]
    paths: ['windows/connector/New-AuthWireDeploymentCandidate.ps1', 'windows/connector/Test-AuthWireDeploymentCandidate.ps1', 'windows/connector/Test-AuthWireCandidateService.ps1', 'tools/deployment_candidate_service_windows_*', 'tools/deployment_candidate_windows_*', 'docs/checkpoints/2026-10-26-dc01-deployment-candidate.ps1', 'kaname/deployment.py', '.github/workflows/deployment-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-candidate:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Pinned cryptography for disposable CA data
        run: python -m pip install cryptography==46.0.0
      - name: Native Windows 5.1 CNG, Authenticode and bounded candidate validation
        run: python tools/deployment_candidate_windows_check.py
      - name: Actual non-admin SCM read-only candidate verification and cleanup
        run: python tools/deployment_candidate_service_windows_check.py
