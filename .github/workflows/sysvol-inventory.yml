name: AuthWire readonly SYSVOL inventory checks
on:
  pull_request:
    paths: ['windows/connector/SysvolInventory.ps1', 'docs/checkpoints/2026-10-27-dc01-sysvol-inventory.ps1', 'tools/sysvol_inventory_windows_check.ps1', '.github/workflows/sysvol-inventory.yml']
  push:
    branches: [main]
    paths: ['windows/connector/SysvolInventory.ps1', 'docs/checkpoints/2026-10-27-dc01-sysvol-inventory.ps1', 'tools/sysvol_inventory_windows_check.ps1', '.github/workflows/sysvol-inventory.yml']
permissions:
  contents: read
jobs:
  native-inventory:
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Real NTFS read, descendant drift, junction and bounds
        shell: powershell
        run: tools/sysvol_inventory_windows_check.ps1
