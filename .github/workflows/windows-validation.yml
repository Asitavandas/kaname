name: KANAME Windows validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-validation.yml'
      - 'kaname/**'
      - 'tests/**'
      - 'tools/**'
permissions:
  contents: read
concurrency:
  group: kaname-windows-validation
  cancel-in-progress: false
jobs:
  test-installed-python:
    if: github.repository == 'Asitavandas/kaname' && github.event.repository.private == true
    runs-on: [self-hosted, Windows, X64, kaname-windows]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout KANAME test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test with installed KANAME interpreter and temporary fixture state
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\Administrator\KANAME\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'KANAME interpreter is missing.' }
          & $python --version
          & $python -m unittest discover -s tests -t . -v
          if ($LASTEXITCODE -ne 0) { throw 'KANAME Windows validation failed.' }
