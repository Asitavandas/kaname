name: KANAME Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaname-windows-fixtures
  cancel-in-progress: false
jobs:
  test-windows-fixtures:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout KANAME test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test on disposable Windows with temporary fixture state
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -m pip install --only-binary=:all: cryptography==46.0.0
          if ($LASTEXITCODE -ne 0) { throw 'KANAME test dependency failed.' }
          python -m unittest discover -s tests -t . -v
          if ($LASTEXITCODE -ne 0) { throw 'KANAME Windows validation failed.' }
