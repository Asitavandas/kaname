name: AuthWire empty stage recovery
on:
  pull_request:
    paths:
      - '.github/workflows/staging-empty-recovery.yml'
      - 'tools/staging_write_empty_recovery_fixture.ps1'
      - 'tools/staging_write_execution_windows_check.ps1'
      - 'tools/staging_write_cycle_windows_check.py'
      - 'windows/connector/StagingWriteHistory.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empty-recovery:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f5b98a5ec593a64f82314c9d93c625398c8b7cbf
          path: _empty_backend
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - name: Exact empty directory removal and separate audited closure
        env:
          AUTHWIRE_STAGE_RECOVERY_CLOSURE_CHECK: '1'
          AUTHWIRE_EMPTY_STAGE_RECOVERY_CHECK: '1'
          AUTHWIRE_RECOVERY_BACKEND: ${{ github.workspace }}\_empty_backend
        run: python tools/staging_write_cycle_windows_check.py
