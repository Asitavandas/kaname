name: AuthWire Windows write scheduler checks
on:
  pull_request:
    paths:
      - 'windows/connector/StagingWriteScheduler.ps1'
      - 'windows/connector/StagingWriteLifecycle.ps1'
      - 'tools/staging_write_scheduler_windows_check.ps1'
      - '.github/workflows/staging-write-scheduler.yml'
  push:
    branches: [main]
    paths:
      - 'windows/connector/StagingWriteScheduler.ps1'
      - 'windows/connector/StagingWriteLifecycle.ps1'
      - 'tools/staging_write_scheduler_windows_check.ps1'
      - '.github/workflows/staging-write-scheduler.yml'
permissions:
  contents: read
jobs:
  scheduler-policy:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - shell: powershell
        run: '& .\tools\staging_write_scheduler_windows_check.ps1'
