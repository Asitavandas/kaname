name: AuthWire scoped filesystem panel approvals
on:
  pull_request:
    paths:
      - 'kaname/staging_write_panel.py'
      - 'kaname/server.py'
      - 'kaname/static/deployment.js'
      - 'kaname/static/staging-write-panel.js'
      - 'kaname/static/index.html'
      - 'tests/test_staging_write_panel*.py'
      - 'tools/staging_write_panel_ui_smoke.cjs'
      - '.github/workflows/staging-write-panel.yml'
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install cryptography==46.0.0
      - run: python -m unittest tests.test_staging_write_panel tests.test_staging_write_panel_http -q
      - run: npm install --no-save --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/staging_write_panel_ui_smoke.cjs
      - run: node tools/deployment_candidate_ui_smoke.cjs
