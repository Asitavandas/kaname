name: AuthWire offline restore and GPO audit checks
on:
  pull_request:
    paths: ['tools/offline_restore_check.py', 'tools/AuthWire-GPO-Audit.ps1', 'tools/gpo_audit_fixture.ps1', 'tests/test_offline_restore_check.py', '.github/workflows/remote-readiness.yml']
  push:
    branches: [main]
    paths: ['tools/offline_restore_check.py', 'tools/AuthWire-GPO-Audit.ps1', 'tools/gpo_audit_fixture.ps1', 'tests/test_offline_restore_check.py', '.github/workflows/remote-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel the superseded unbounded PR33 fixture only
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 33
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_info=$(gh api repos/Asitavandas/kaname/actions/runs/39123091614 --jq '[.head_sha,.status]|join(" ")')
          if [ "$old_info" = "e9538ce4798d1cffb967e6163f33daf924484399 in_progress" ]; then
            gh api --method POST repos/Asitavandas/kaname/actions/runs/39123091614/cancel
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - run: python -m unittest tests.test_offline_restore_check -v
  windows-readonly-audit:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Real Authenticode, pinned bodies/assets, ACL and Startup fixtures
        shell: powershell
        run: tools/gpo_audit_fixture.ps1
