name: AuthWire Windows journal off-host restore fixture
on:
  pull_request:
    paths:
      - 'windows/connector/StagingFilesystem.ps1'
      - 'windows/connector/StagingWriteJournalBackup.ps1'
      - 'tools/staging_write_journal_backup_windows_check.ps1'
      - '.github/workflows/staging-write-journal-backup.yml'
  push:
    branches: [main]
    paths:
      - 'windows/connector/StagingFilesystem.ps1'
      - 'windows/connector/StagingWriteJournalBackup.ps1'
      - 'tools/staging_write_journal_backup_windows_check.ps1'
      - '.github/workflows/staging-write-journal-backup.yml'
permissions:
  contents: read
jobs:
  export-fixture:
    runs-on: windows-2025
    timeout-minutes: 8
    outputs:
      manifest: ${{ steps.export.outputs.manifest_sha256 }}
      scope: ${{ steps.export.outputs.scope_sha256 }}
      tree: ${{ steps.export.outputs.tree_sha256 }}
      archive: ${{ steps.export.outputs.tar_sha256 }}
      artifact_name: ${{ steps.export.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: export
        shell: powershell
        run: '& .\tools\staging_write_journal_backup_windows_check.ps1 -Mode Export'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/authwire-journal-fixture.tar
          if-no-files-found: error
          retention-days: 1
  restore-fixture:
    needs: export-fixture
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.export-fixture.outputs.artifact_name }}
          path: ${{ runner.temp }}
      - shell: powershell
        env:
          EXPECTED_MANIFEST: ${{ needs.export-fixture.outputs.manifest }}
          EXPECTED_SCOPE: ${{ needs.export-fixture.outputs.scope }}
          EXPECTED_TREE: ${{ needs.export-fixture.outputs.tree }}
          EXPECTED_ARCHIVE: ${{ needs.export-fixture.outputs.archive }}
        run: |
          & .\tools\staging_write_journal_backup_windows_check.ps1 -Mode Restore -ManifestSha256 $env:EXPECTED_MANIFEST -ScopeSha256 $env:EXPECTED_SCOPE -TreeSha256 $env:EXPECTED_TREE -TarSha256 $env:EXPECTED_ARCHIVE
