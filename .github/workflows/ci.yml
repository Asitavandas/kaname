name: KANAME foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Tested PKI dependency
        run: python -m pip install cryptography==46.0.0
      - name: Core, PKI and HTTP boundary tests
        run: python -m unittest discover -s tests -t . -v
      - name: Syntax validation
        run: python -m compileall -q kaname tools tests
