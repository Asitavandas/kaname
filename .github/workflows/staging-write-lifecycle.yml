name: AuthWire isolated durable write lifecycle
on:
  pull_request:
    paths:
      - 'windows/connector/**'
      - 'kaname/staging_write_jobs.py'
      - 'tools/staging_write_cycle_windows_check.py'
      - 'tools/staging_write_execution_windows_check.ps1'
      - 'tools/staging_write_lifecycle*'
      - '.github/workflows/staging-write-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'windows/connector/StagingWriteLifecycle.ps1'
      - 'windows/connector/StagingWritePollRecord.ps1'
      - 'tools/staging_write_lifecycle*'
      - '.github/workflows/staging-write-lifecycle.yml'
permissions:
  contents: read
jobs:
  native-write-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Tested fixture TLS dependency
        run: python -m pip install cryptography==46.0.0
      - name: Durable stage rollback dispatch and result-only record-boundary recovery
        shell: powershell
        run: |
          python tools/staging_write_lifecycle_windows_check.py
          if($LASTEXITCODE -ne 0){throw 'Durable lifecycle fixture failed'}
