name: AuthWire bounded Windows public trust checks
on:
  pull_request:
    paths: ['docs/checkpoints/2026-10-26-dc01-connector-trust.ps1', 'tools/connector_public_trust_windows_check.ps1', '.github/workflows/connector-public-trust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-trust:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Native PowerShell 5.1 public-only machine trust boundaries with cleanup
        shell: powershell
        run: tools/connector_public_trust_windows_check.ps1
