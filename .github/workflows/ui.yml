name: KANAME browser checks
on:
  push:
    branches: [main]
    paths: ['kaname/**', 'tools/ui_smoke.cjs', 'tools/setup_ui_smoke.cjs', 'tools/session_ui_smoke.cjs', 'tools/services_ui_smoke.cjs', 'tools/device_ui_smoke.cjs', 'tools/planning_ui_smoke.cjs', 'tests/test_directory.py', '.github/workflows/ui.yml']
  pull_request:
    paths: ['kaname/**', 'tools/ui_smoke.cjs', 'tools/setup_ui_smoke.cjs', 'tools/session_ui_smoke.cjs', 'tools/services_ui_smoke.cjs', 'tools/device_ui_smoke.cjs', 'tools/planning_ui_smoke.cjs', '.github/workflows/ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install cryptography==46.0.0
      - run: npm install --no-save --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Browser flow with temporary directory fixture (no real AD)
        run: |
          node tools/ui_smoke.cjs
          node tools/setup_ui_smoke.cjs
          node tools/session_ui_smoke.cjs
          node tools/device_ui_smoke.cjs
          node tools/planning_ui_smoke.cjs
          node tools/services_ui_smoke.cjs
        env:
          KANAME_PYTHON: python
          KANAME_UI_ARTIFACTS: ui-artifacts
      - name: Upload disposable-fixture panel screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaname-flow-panel
          path: ui-artifacts
          if-no-files-found: ignore
          retention-days: 7

