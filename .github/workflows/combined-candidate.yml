name: AuthWire combined signed package checks
on:
  pull_request:
    paths: ['windows/connector/New-AuthWireCombinedCandidate.ps1', 'windows/connector/Test-AuthWireCombinedContent.ps1', 'windows/connector/Test-AuthWireCombinedService.ps1', 'windows/connector/CombinedCandidateContent.ps1', 'windows/connector/Invoke-AuthWireCombinedJob.ps1', 'tools/combined_candidate_windows_*', 'tests/test_combined_candidate_delivery.py', 'docs/checkpoints/2026-10-28-dc01-combined-candidate.ps1', '.github/workflows/combined-candidate.yml']
  push:
    branches: [main]
    paths: ['windows/connector/New-AuthWireCombinedCandidate.ps1', 'windows/connector/Test-AuthWireCombinedContent.ps1', 'windows/connector/Test-AuthWireCombinedService.ps1', 'windows/connector/CombinedCandidateContent.ps1', 'windows/connector/Invoke-AuthWireCombinedJob.ps1', 'tools/combined_candidate_windows_*', 'tests/test_combined_candidate_delivery.py', 'docs/checkpoints/2026-10-28-dc01-combined-candidate.ps1', '.github/workflows/combined-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-combined-signing:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - name: Windows 5.1 real Authenticode, immutable input, marked CNG key and negative fixtures
        run: python tools/combined_candidate_windows_check.py
